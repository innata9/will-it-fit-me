<script>
"use strict";

/* ===================== Data ===================== */

const MEASURES = [
  { key: "heightCm", title: "Height", unit: "cm", req: true, min: 120, max: 220, how: "Stand barefoot with your back and heels against a wall. Lay a book flat on your head, mark the wall under it, and measure from the floor to the mark.", why: "Used to work out where hems and lengths will land on you." },
  { key: "bustCm", title: "Bust", unit: "cm", req: true, min: 60, max: 180, how: "Wrap the tape around the fullest part of your bust, level across your back. Wear a non-padded bra.", why: "Key for tops, dresses and jackets." },
  { key: "waistCm", title: "Waist", unit: "cm", req: true, min: 45, max: 180, how: "Find the narrowest part of your torso, usually 2–3 cm above the navel. Breathe out normally — don’t hold your stomach in.", why: "Key for skirts, trousers and belted dresses." },
  { key: "hipsCm", title: "Hips", unit: "cm", req: true, min: 60, max: 190, how: "Stand with feet together and measure around the fullest part of your seat. Check in a mirror that the tape stays level.", why: "Often the measurement that decides the size of trousers and dresses." },
  { key: "underbustCm", title: "Underbust", unit: "cm", req: false, min: 55, max: 160, how: "Measure directly under your bust, snug against the ribcage.", why: "Needed for bras, swimwear and fitted bodices." },
  { key: "shouldersCm", title: "Shoulders", unit: "cm", req: false, min: 25, max: 60, how: "Measure across your back from one shoulder bone to the other. This one is easier with a helper.", why: "Shows whether jackets and shirts will sit right on the shoulder." },
  { key: "thighCm", title: "Thigh", unit: "cm", req: false, min: 35, max: 100, how: "Measure around the fullest part of your upper thigh, just below the crotch.", why: "Helps with slim and straight-leg jeans." },
  { key: "calfCm", title: "Calf", unit: "cm", req: false, min: 25, max: 70, how: "Stand with weight on both feet and measure around the widest part of your calf.", why: "Compared with the boot shaft, so you know if boots will zip up." },
  { key: "inseamCm", title: "Inseam", unit: "cm", req: false, min: 55, max: 100, how: "Barefoot, measure from the crotch down the inside of the leg to the floor. Or measure the inside seam of trousers that are the right length.", why: "Tells you whether trousers will need shortening." },
  { key: "armCm", title: "Arm length", unit: "cm", req: false, min: 40, max: 80, how: "With your arm slightly bent, measure from the shoulder bone over the elbow to the wrist bone.", why: "Shows whether sleeves will be too short or too long." },
  { key: "footCm", title: "Foot length", unit: "cm", req: false, min: 18, max: 32, how: "Stand on paper with your heel against a wall and trace your foot. Measure from the heel to the longest toe. Do both feet in the evening and use the longer one.", why: "Matched to each brand’s shoe size chart." },
  { key: "weightKg", title: "Weight", unit: "kg", req: false, min: 30, max: 250, how: "Optional. Weigh yourself in the morning on the same scale.", why: "Only used to read size charts that list weight. Never shown or commented on." },
];
const TIPS = ["Use a soft tape measure, not a metal one.", "Measure over thin underwear or close-fitting clothes.", "Keep the tape level all the way around — check in a mirror.", "Snug, not tight: one finger should slide under the tape.", "Stand straight and relaxed, feet together, looking ahead.", "Measure twice. If the numbers differ, use the average."];
const SLOTS = ["dress", "top", "bottom", "outerwear", "shoes", "bag", "accessory"];
const SLOT_LABEL = { dress: "Dress", top: "Top", bottom: "Bottom", outerwear: "Outerwear", shoes: "Shoes", bag: "Bag", accessory: "Accessory" };
const OCCASIONS = ["Office", "Weekend", "Evening", "Travel"];
const FOLDER_FOR = { Office: "Work", Weekend: "Weekend", Evening: "Evening", Travel: "Vacation" };
const ITEM_COLORS = [["Black","#1E1D22"],["White","#FAFAF7"],["Cream","#F1E6D2"],["Beige","#C8A27A"],["Camel","#B88A5A"],["Brown","#5A3A28"],["Grey","#9A9CA3"],["Navy","#1F2A4A"],["Blue","#5C6F8A"],["Teal","#2F7D74"],["Olive","#6E6B2F"],["Green","#3E7A4A"],["Mustard","#C9962B"],["Rust","#9C4A25"],["Terracotta","#B5603F"],["Red","#B3261E"],["Pink","#E7A6BF"],["Purple","#6B3F8F"]];
const VERDICT = { buy: ["Buy it", "good"], conditional: ["Conditional", "warn"], risky: ["Risky", "risky"], no: ["Won’t fit", "bad"] };
const RATING = { good: ["Good", "good"], watch: ["Watch out", "warn"], bad: ["Problem", "bad"] };
const AXIS = { size: "Size", cut: "Cut and proportions", color: "Color", fabric: "Fabric" };

const DEFAULT_DATA = () => ({ v: 1, onboarded: false, m: {}, notes: [], colorType: null, checks: [], wardrobe: [], folders: ["Work", "Weekend", "Evening", "Vacation"], looks: [], fits: [] });

const S = {
  data: DEFAULT_DATA(),
  view: "boot", params: {}, history: [],
  ui: {},
  mem: { files: {}, shots: [], selfie: null, selfieUrl: null },
  caps: { sample: null, db: null, downloads: null, uid: null, images: null },
};

/* ===================== Helpers ===================== */

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const hex = (h, fb = "#9A9CA3") => (typeof h === "string" && /^#[0-9a-fA-F]{6}$/.test(h.trim()) ? h.trim() : fb);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const arr = (x) => (Array.isArray(x) ? x : []);
const cap = (s) => String(s || "").charAt(0).toUpperCase() + String(s || "").slice(1);

function bodyShape(m) {
  const b = m.bustCm, w = m.waistCm, h = m.hipsCm;
  if (!b || !w || !h) return null;
  if (h - b >= 5 && h - w >= 18) return "pear";
  if (b - h >= 5 && b - w >= 18) return "inverted triangle";
  if (Math.abs(b - h) < 5 && (b - w >= 18 || h - w >= 18)) return "hourglass";
  if (w >= b && w >= h) return "apple";
  return "rectangle";
}
const heightCat = (h) => (!h ? null : h < 160 ? "petite" : h >= 175 ? "tall" : "regular");
const completeness = (m) => Math.round((MEASURES.filter((s) => m[s.key] != null).length / MEASURES.length) * 100);
const hasMinimum = (m) => MEASURES.filter((s) => s.req).every((s) => m[s.key] != null);
const catToSlot = (c) => (c === "boots" ? "shoes" : SLOTS.includes(c) ? c : "accessory");

function rgb(h) { const n = parseInt(hex(h).slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function dist(a, b) { const x = rgb(a), y = rgb(b), rm = (x[0] + y[0]) / 2; const dr = x[0] - y[0], dg = x[1] - y[1], db = x[2] - y[2]; return Math.sqrt((2 + rm / 256) * dr * dr + 4 * dg * dg + (2 + (255 - rm) / 256) * db * db); }
function paletteFit(h, ct) {
  if (!h || !ct) return "unknown";
  const near = (l) => Math.min(Infinity, ...arr(l).map((s) => dist(h, s.hex)));
  const best = near(ct.best), neu = near(ct.neutrals), avoid = near(ct.avoid);
  if (avoid < Math.min(best, neu) && avoid < 120) return "avoid";
  if (best < 150) return "in";
  if (neu < 150) return "neutral";
  return avoid < 200 ? "avoid" : "unknown";
}

/* Deterministic size match: smallest size where no measurement is over its max (stretch gives tolerance). */
function matchSize(chart, m, stretch) {
  const keys = { bust: "bustCm", waist: "waistCm", hips: "hipsCm", inseam: "inseamCm", footLength: "footCm" };
  const f = chart.unit === "in" ? 2.54 : 1;
  const tol = stretch === "high" ? 3 : stretch === "some" ? 1.5 : 0;
  const rows = arr(chart.rows).map((r) => {
    const fits = [];
    for (const k of Object.keys(keys)) {
      const body = m[keys[k]], rg = r[k];
      if (body == null || !rg || (rg.min == null && rg.max == null)) continue;
      const min = rg.min != null ? Math.round(rg.min * f * 10) / 10 : null;
      const max = rg.max != null ? Math.round(rg.max * f * 10) / 10 : null;
      let status = "fits", diff = 0;
      if (max != null && body > max) { status = "tight"; diff = Math.round((body - max) * 10) / 10; }
      else if (min != null && body < min) { status = "loose"; diff = Math.round((min - body) * 10) / 10; }
      fits.push({ measure: k, body, min, max, status, diff });
    }
    return { size: String(r.size), fits };
  });
  const ok = (r) => r.fits.length > 0 && r.fits.every((x) => x.status !== "tight" || x.diff <= tol);
  const i = rows.findIndex(ok);
  let recommended = i >= 0 ? rows[i].size : rows.some((r) => r.fits.length) ? rows[rows.length - 1].size : null;
  let borderline = null;
  if (i > 0) { const t = rows[i - 1].fits.filter((x) => x.status === "tight"); if (t.length === 1 && t[0].diff <= 2) borderline = { size: rows[i - 1].size, measure: t[0].measure, overCm: t[0].diff }; }
  return { recommended, borderline, rows };
}

function profileForAI() {
  const d = S.data, ct = d.colorType;
  return {

let saveTimer = null;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(persist, 600);
}
async function persist() {
  const d = S.data;
  let json = JSON.stringify(d);
  while (json.length > 230000 && d.checks.length > 5) { d.checks.pop(); json = JSON.stringify(d); }
  try { localStorage.setItem("wifm", json); } catch (e) { /* storage may be blocked */ }
  if (S.caps.db && S.caps.uid) {
    try { await S.caps.db.doc("data/users/" + S.caps.uid + "/app").set(JSON.parse(json)); S.ui.saveError = null; }
    catch (e) { S.ui.saveError = e && e.code === "quota_exceeded" ? "Storage is full — delete some old checks." : null; }
  }
}
async function load() {
  let loaded = null;
  if (S.caps.db && S.caps.uid) {
    try { const snap = await S.caps.db.doc("data/users/" + S.caps.uid + "/app").get(); if (snap.exists) loaded = snap.data(); } catch (e) { /* fall back */ }
  }
  if (!loaded) { try { const raw = localStorage.getItem("wifm"); if (raw) loaded = JSON.parse(raw); } catch (e) { /* none */ } }
  if (loaded && typeof loaded === "object") {
    const base = DEFAULT_DATA();
    S.data = Object.assign(base, JSON.parse(JSON.stringify(loaded)));
    S.data.checks = arr(S.data.checks).map((c) => (c.status === "pending" ? Object.assign({}, c, { status: "error", error: "Interrupted — add the screenshots again to retry." }) : c));
  }
}

function aiError(e) {
  const code = e && e.code;
  if (code === "not_granted" || code === "sampling_disabled") return "AI checks need your permission. Allow Claude for this page and try again.";
  if (code === "rate_limited") return "You’ve hit your Claude usage limit for now. Try again a bit later.";
  if (code === "image_rejected") return "One of the images couldn’t be read. Use a JPG or PNG screenshot.";
  if (code === "images_unavailable") return "This view can’t send photos to Claude. Open the page in the Claude app or on claude.ai.";
  if (code === "invalid_json") return "The answer came back incomplete. Tap Try again.";
  if (code === "refused") return "Claude couldn’t analyse this. Try a different photo.";
  if (code === "session_expired") return "Please sign in to Claude again.";
  if (code === "cancelled") return "Stopped.";
  return (e && e.message && !e.code) ? e.message : "Something went wrong. Tap Try again.";
}

async function analyseSelfie(answers, measured) {

/* Body proportions from the measurements. The drawing is made for a 170 cm body with
   38 cm shoulders, 90 bust, 70 waist, 98 hips; widths are scaled band by band, and the
   whole figure is scaled by height so a shorter person stands shorter in the frame. */
function bodyFactors() {
  const m = S.data.m;
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const r = (val, ref, lo = 0.8, hi = 1.35) => (val ? clamp(val / ref, lo, hi) : 1);
  const h = clamp(m.heightCm || 170, 140, 200);
  const sh = r(m.shouldersCm, 38), b = r(m.bustCm, 90), w = r(m.waistCm, 70, 0.8, 1.5), hp = r(m.hipsCm, 98);
  const th = m.thighCm ? r(m.thighCm, 55) : hp, cf = m.calfCm ? r(m.calfCm, 35) : (hp + 1) / 2;
  return { h, sc: clamp(h / 172, 0.84, 1.1), s: sh, sRef: 1, b, w, hp, th, cf,
    anchors: [[60, 1], [76, sh], [100, b], [128, w], [182, hp], [250, th], [320, cf], [400, cf]] };
}
function widthAt(y, K) {
  const a = K.anchors;
  if (y <= a[0][0]) return a[0][1];
  for (let i = 1; i < a.length; i++) {
    if (y <= a[i][0]) { const [y0, k0] = a[i - 1], [y1, k1] = a[i]; return k0 + ((k1 - k0) * (y - y0)) / (y1 - y0); }
  }
  return a[a.length - 1][1];
}
function warpBody(svg, K) {
  const wx = (x, y) => (100 + (x - 100) * widthAt(y, K)).toFixed(1);
  return svg
    .replace(/ d="([^"]*)"/g, (_, d) => ` d="${d.replace(/(-?\d*\.?\d+) (-?\d*\.?\d+)/g, (m, x, y) => `${wx(+x, +y)} ${y}`)}"`)
    .replace(/<ellipse cx="([\d.]+)" cy="([\d.]+)"/g, (m, cx, cy) => `<ellipse cx="${wx(+cx, +cy)}" cy="${cy}"`);
}

/* ===================== Garment fitting: shop photo -> YOUR body =====================
 * RULE (do not regress): a shop photo is NEVER pasted as a plain rectangle.
 * 1. The cut-out is trimmed to the garment itself (transparent margins removed),
 *    and its outline is measured row by row (left/right edge of the fabric).
 * 2. On the avatar, every row is re-drawn at the width the garment would have on
 *    THIS body at that height: the photographed shape at true scale, widened where
 *    this body is wider than average, and never narrower than the body where it
 *    must cover it (bust down for tops/dresses/coats, everywhere for bottoms).
 *    Necklines, halters and straps above the bust keep their own shape.
 * 3. Length: the chart's "total length" in cm when known. The hem is placed at its REAL
 *    height above the floor: start point height (shoulder / bodice / waist, as a share of
 *    the user's height, GF_START) minus the length. Otherwise the photo's proportions
 *    re-scaled from the model's height to the user's.
 * 4. Getting the garment out of a shop photo is AUTOMATIC (gfExtract): the user only
 *    picks the photo. No box to draw, no manual selection step - ever.
 * Avatar frame: x centre 100; head top y=14, soles y=397 -> 383 units = user's height.
 */
const GF_ROWS = 64;
const GF_UNITS = 383;
const GF_STYLE = 0.9;   // the avatar is drawn a little slimmer than life
const GF_BUST_Y = 95;  // from here down a top/dress/coat must cover the body

// Half-width of the neutral avatar (all factors 1) at height y, local units.
const GF_TORSO = [[70, 14], [76, 30], [100, 31], [128, 24], [150, 27], [172, 30], [182, 33], [234, 32], [300, 22], [352, 20], [390, 17]];

function gfLerp(tab, y) {
  if (y <= tab[0][0]) return tab[0][1];
  for (let i = 1; i < tab.length; i++) {
    if (y <= tab[i][0]) { const [y0, v0] = tab[i - 1], [y1, v1] = tab[i]; return v0 + ((v1 - v0) * (y - y0)) / (y1 - y0); }
  }
  return tab[tab.length - 1][1];
}

// Measure the garment outline in an RGBA buffer. Returns the trimmed bounding box
// (pixels) and GF_ROWS rows of [left, right] as fractions of the box width (null = empty row).
function gfMeasure(data, W, H, alphaMin = 40) {
  let x0 = W, x1 = -1, y0 = H, y1 = -1;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    if (data[(y * W + x) * 4 + 3] >= alphaMin) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  }
  if (x1 < 0) return null;
  const bw = x1 - x0 + 1, bh = y1 - y0 + 1, rows = [];
  for (let i = 0; i < GF_ROWS; i++) {
    const ya = y0 + Math.floor((i * bh) / GF_ROWS), yb = Math.max(ya + 1, y0 + Math.floor(((i + 1) * bh) / GF_ROWS));
    let l = Infinity, r = -1;
    for (let y = ya; y < yb && y <= y1; y++) {
      // ignore single stray pixels: need a short run of fabric

// Automatic cut-out of the garment from a shop photo (RGBA buffer, edited in place).

    const list = [s]; lab[s] = s;
    for (let i = 0; i < list.length; i++) {
      const p = list[i], x = p % W;
      for (const k of [x > 0 ? p - 1 : -1, x < W - 1 ? p + 1 : -1, p - W, p + W]) if (k >= 0 && k < N && !bg[k] && lab[k] < 0) { lab[k] = s; list.push(k); }

// All "total length" values (cm) of a pasted size chart: [{ size, lengthCm }].
function gfChartLengths(chart) {
  if (!chart) return [];
  const lines = String(chart).split(/\n/).map((l) => l.split(/\s*\|\s*|\t+/).map((c) => c.trim()));
  const head = lines.find((c) => c.some((x) => /length|довжин/i.test(x)) && c.some((x) => /size|розмір|частина/i.test(x)));
  if (!head) return [];
  const col = head.findIndex((x) => /total length|length|довжин/i.test(x));
  const num = (s) => { const m = String(s || "").match(/\d+(?:[.,]\d+)?/); return m ? parseFloat(m[0].replace(",", ".")) : null; };

  // (a body chart and a garment chart are often pasted together).
  const rows = [];
  for (let i = lines.indexOf(head) + 1; i < lines.length; i++) {
    const c = lines[i];
    if (c.length === 1 && !c[0]) break;
    if (/^(size|розмір|частина)$/i.test(c[0])) break;
    const v = c.length > col ? num(c[col]) : null;
    if (v && v > 15 && v < 200 && /^[A-Z0-9]{1,4}$/i.test(c[0])) rows.push({ size: c[0].toUpperCase(), lengthCm: v });
  }

}

// "Total length" (cm) for one size (falls back to the middle size).
function gfChartLengthCm(chart, size) {
  const rows = gfChartLengths(chart);
  if (!rows.length) return null;
  const want = rows.find((r) => size && r.size === String(size).toUpperCase()) || rows[Math.floor(rows.length / 2)];
  return want.lengthCm;
}

// ---------- Where the hem really lands: measured from the floor, not from the model ----------

    measuredFrom: { shoulder: "the high point of the shoulder", bodice: "the top edge of the bodice (straps not included)", high: "the natural waist", mid: "a mid-rise waistband", low: "a low-rise waistband" }[start],

    bodice: { mini: 78, knee: 92, midi: 108, maxi: 128 },
    shoulder: { mini: 85, knee: 100, midi: 118, maxi: 140 },
    high: { mini: 42, knee: 60, midi: 78, maxi: 98 }, mid: { mini: 40, knee: 58, midi: 75, maxi: 95 }, low: { mini: 38, knee: 56, midi: 72, maxi: 92 },

// Plan the bands: where each measured row of the photo lands on the avatar and how wide.
// kind: "upper" (top / dress / coat) or "bottom" (skirt / trousers).
// opts: { K (bodyFactors + widthAt), widthAt, modelH, lengthCm, rise: "high"|"mid"|"low", loose }
function gfPlan(fit, kind, opts) {

// Render a plan as SVG: one shared <image>, each band clipped and stretched to its width.
function gfSVG(url, plan, id) {
  const IW = 100; // the image is laid out 0..IW wide, then each band is moved/scaled into place
  let out = `<defs><image id="${id}i" href="${url}" x="0" y="${plan.y0.toFixed(2)}" width="${IW}" height="${plan.gh.toFixed(2)}" preserveAspectRatio="none"/>`;
  plan.bands.forEach((b, i) => { out += `<clipPath id="${id}${i}"><rect x="0" y="${b.y.toFixed(2)}" width="200" height="${(b.h + 1.2).toFixed(2)}"/></clipPath>`; });
  out += `</defs>`;
  plan.bands.forEach((b, i) => {
    const s = (2 * b.half) / ((b.r - b.l) * IW), cx = ((b.l + b.r) / 2) * IW;
    out += `<g clip-path="url(#${id}${i})"><use href="#${id}i" transform="translate(${(100 - s * cx).toFixed(2)} 0) scale(${s.toFixed(4)} 1)"/></g>`;
  });
  return out;
}

// Everything the fitter needs to know about a piece: its photo outline, the chart
// length for the recommended size, the model's height and how high it sits.
function fitPhoto(piece, photo, kind, K, id, loose) {
  if (!photo.fit) return "";
  const c = S.data.checks.find((x) => x.id === piece.ref);
  const L = c ? lengthInfo(c) : null;
  const plan = gfPlan(photo.fit, kind, { K, widthAt, modelH: Number(piece.modelH) || 176, lengthCm: L && L.lengthCm, rise: L ? L.rise : "mid", start: L && L.start, loose });
  return plan ? gfSVG(photo.url, plan, id) : "";
}

// The size whose length matters: the one she bought (fit feedback), else the recommended one.
function lengthInfo(c) {

  const it = c.result.item, kind = catToSlot(it.category) === "bottom" ? "bottom" : "upper";
  const bought = S.data.fits.find((f) => f.item === it.name && f.size && f.size !== "?");
  const size = (bought && bought.size) || c.result.verdict.recommendedSize || (c.result.sizeMatch && c.result.sizeMatch.recommended);
  const txt = `${it.name} ${it.lengthNote || ""} ${c.input.details || ""}`;

function bodyNote(modelH, c) {
  const m = S.data.m;
  const parts = [m.heightCm ? `${m.heightCm} cm tall` : null, m.shouldersCm ? `${m.shouldersCm} cm shoulders` : null, m.bustCm && m.waistCm && m.hipsCm ? `${m.bustCm}/${m.waistCm}/${m.hipsCm}` : null].filter(Boolean);
  const own = parts.length ? `Drawn to your body: ${parts.join(", ")}.` : "Add your measurements to shape the avatar.";
  const L = c ? lengthInfo(c) : null;
  const hem = L && L.hemCm !== null ? (L.estimated ? ` No length in the size chart, so a typical ${L.lengthCm} cm is assumed: the hem is about ${gfHemWords(L.hemCm, Number(S.data.m.heightCm))} on you, barefoot.` : ` Length ${L.lengthCm} cm (size ${L.size}): the hem is ${gfHemWords(L.hemCm, Number(S.data.m.heightCm))} on you, barefoot.`) : "";
  return `${own}${hem} Shop photo re-proportioned from a ${modelH ? modelH + " cm" : "typical 176 cm"} model.`;
}

let avatarSeq = 0;

    s += `<path d="M55 203 C53 211 54 221 58 223 C62 224 65 214 64 204 Z" fill="${skin}"/><path d="M145 203 C147 211 146 221 142 223 C138 224 135 214 136 204 Z" fill="${skin}"/>`;
  }

  s = s.slice(0, bodyStart) + warpBody(s.slice(bodyStart), K);

const TAB_VIEWS = ["home", "wishlist", "looks", "profile"];
function go(view, params = {}, opts = {}) {
  if (!opts.replace && S.view !== "boot") S.history.push([S.view, S.params]);
  if (TAB_VIEWS.includes(view)) S.history = [];
  S.view = view; S.params = params; S.ui.confirm = null;
  render();
  window.scrollTo(0, 0);
}
function back() {
  const prev = S.history.pop();
  if (prev) { S.view = prev[0]; S.params = prev[1]; render(); window.scrollTo(0, 0); }
  else go(S.data.onboarded ? "home" : "welcome", {}, { replace: true });
}

// Recent checks: 20 per page, newest first, with page controls when there are more.
const CHECKS_PER_PAGE = 20;
function recentPage() {
  const total = S.data.checks.length, pages = Math.max(1, Math.ceil(total / CHECKS_PER_PAGE));
  const page = Math.min(Math.max(1, S.ui.recentPage || 1), pages);
  S.ui.recentPage = page;
  const start = (page - 1) * CHECKS_PER_PAGE;
  const rows = S.data.checks.slice(start, start + CHECKS_PER_PAGE).map(checkRow).join("");
  if (pages === 1) return `<div class="stack">${rows}</div>`;
  const btn = (p, label, aria, cur) => `<button class="pagebtn${cur ? " on" : ""}" data-a="recentGo" data-v="${p}" aria-label="${aria}"${cur ? ' aria-current="page"' : ""}${p < 1 || p > pages ? " disabled" : ""}>${label}</button>`;
  const nums = [];
  for (let p = 1; p <= pages; p++) {
    if (p === 1 || p === pages || Math.abs(p - page) <= 1) nums.push(btn(p, p, `Page ${p}`, p === page));
    else if (nums[nums.length - 1] !== "…") nums.push("…");
  }
  return `<div class="stack">${rows}</div>
  <nav class="pager" aria-label="Recent checks pages">${btn(page - 1, "&lsaquo;", "Previous page")}${nums.map((n) => (n === "…" ? `<span class="tiny" aria-hidden="true">&hellip;</span>` : n)).join("")}${btn(page + 1, "&rsaquo;", "Next page")}</nav>
  <p class="tiny" style="text-align:center">${start + 1}&ndash;${Math.min(start + CHECKS_PER_PAGE, total)} of ${total}</p>`;
}

function candidates(excludeId) {
  const out = {}; SLOTS.forEach((s) => (out[s] = []));
  S.data.wardrobe.forEach((w) => out[w.slot] && out[w.slot].push({ slot: w.slot, name: w.name, colorHex: w.colorHex, source: "wardrobe", ref: w.id }));
  S.data.checks.forEach((c) => {
    const it = c.result && c.result.item;
    if (!it || c.id === excludeId || c.result.verdict.verdict === "no") return;
    const slot = catToSlot(it.category);
    out[slot].push({ slot, name: it.name, colorHex: it.colorHex, length: it.lengthNote || "", modelH: it.modelHeightCm || null, source: c.wished ? "wishlist" : "checked", ref: c.id });
  });
  return out;
}

/* ===================== On-device color picking ===================== */
/* The photo never leaves the phone: pixels are read from a canvas where the user taps. */

const PICK_STEPS = [
  { k: "white", t: "Tap something white", d: "Your white top or a white wall. This corrects the color of the light. No white in the photo? Skip this step.", optional: true },
  { k: "skin", t: "Tap your cheek", d: "A clear patch of skin in good light, not in shadow and not shiny." },
  { k: "hair", t: "Tap your hair", d: "An area with your typical hair color, not a shiny highlight." },
  { k: "eyes", t: "Tap the colored part of your eye", d: "Zoom in on the photo first if you can. Too small to tap? Choose your eye color below.", choices: ["Blue or grey", "Green or hazel", "Light brown", "Dark brown or black"] },
];

function loadPickImage(url, done) {
  const img = new Image();
  img.onload = () => {
    const scale = Math.min(1, 1000 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(img.naturalWidth * scale));
    c.height = Math.max(1, Math.round(img.naturalHeight * scale));
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    S.mem.pickBase = c;
    done();
  };
  img.onerror = () => { S.ui.homeErr = "That photo couldn’t be opened. Try a JPG or PNG."; render(); };
  img.src = url;
}

function sampleAt(x, y) {
  const base = S.mem.pickBase;
  const r = Math.max(2, Math.round(base.width / 160));
  const x0 = Math.max(0, Math.round(x) - r), y0 = Math.max(0, Math.round(y) - r);
  const w = Math.min(base.width - x0, r * 2 + 1), h = Math.min(base.height - y0, r * 2 + 1);
  const d = base.getContext("2d").getImageData(x0, y0, w, h).data;
  let R = 0, G = 0, B = 0, n = 0;
  for (let i = 0; i < d.length; i += 4) { R += d[i]; G += d[i + 1]; B += d[i + 2]; n++; }
  return [R / n, G / n, B / n];
}
const toHex = (c) => "#" + c.map((v) => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, "0")).join("").toUpperCase();
function balance(c, white) {
  if (!white) return c;
  const avg = (white[0] + white[1] + white[2]) / 3;
  return c.map((v, i) => v * Math.min(1.6, Math.max(0.6, avg / Math.max(1, white[i]))));
}

function drawPickCanvas(marks) {
  const cv = $("#pickCanvas"), base = S.mem.pickBase;
  if (!cv || !base) return;
  cv.width = base.width; cv.height = base.height;
  const ctx = cv.getContext("2d");
  ctx.drawImage(base, 0, 0);
  const rad = Math.max(8, base.width / 45);
  for (const m of marks) {
    ctx.beginPath(); ctx.arc(m.x, m.y, rad, 0, Math.PI * 2);
    ctx.lineWidth = Math.max(3, rad / 3); ctx.strokeStyle = "#FFFFFF"; ctx.stroke();
    ctx.beginPath(); ctx.arc(m.x, m.y, rad + ctx.lineWidth / 2, 0, Math.PI * 2);
    ctx.lineWidth = 1.5; ctx.strokeStyle = "#18171C"; ctx.stroke();
  }
}

/* ===================== Shop photo try-on (on device only) ===================== */

function garmentFor(id) {
  if (!id) return null;
  if (S.mem.garments && S.mem.garments[id] !== undefined) return S.mem.garments[id];
  S.mem.garments = S.mem.garments || {};
  let g = null;
  try { const raw = localStorage.getItem("wifm-g-" + id); if (raw) g = JSON.parse(raw); } catch (e) { g = null; }
  if (g && g.url && !g.fit) { measureSaved(id, g); g = null; } // older photo: measure its outline first, then redraw
  S.mem.garments[id] = g && g.url ? g : null;
  return S.mem.garments[id];
}

// Measures the garment outline of a cut-out (trims empty margins) -> {url, w, h, fit}.
function measureCanvas(cv) {
  const ctx = cv.getContext("2d"), d = ctx.getImageData(0, 0, cv.width, cv.height).data;
  const fit = gfMeasure(d, cv.width, cv.height);
  if (!fit) return null;
  const b = fit.box, out = document.createElement("canvas");
  out.width = b.w; out.height = b.h;
  out.getContext("2d").drawImage(cv, b.x, b.y, b.w, b.h, 0, 0, b.w, b.h);
  return { url: out.toDataURL("image/png"), w: b.w, h: b.h, fit: { box: { w: b.w, h: b.h }, rows: fit.rows } };
}
// The shop photo Claude read from the product page (saved in this app's own file store)
// goes onto the avatar automatically - same cut-out and fitting as a photo you pick.
function autoGarment(c) {
  S.mem.autoTried = S.mem.autoTried || {};
  const src = photoUrlFor(c);
  if (!c || c.status !== "done" || !src || (c.input && c.input.photoOff) || S.mem.autoTried[c.id]) return;
  try { if (localStorage.getItem("wifm-g-" + c.id)) return; } catch (e) { /* ignore */ }
  if (S.mem.garments && S.mem.garments[c.id]) return;
  S.mem.autoTried[c.id] = true;
  const img = new Image();
  img.onload = () => {
    const scale = Math.min(1, 800 / Math.max(img.naturalWidth, img.naturalHeight));
    const cv = document.createElement("canvas");
    cv.width = Math.max(1, Math.round(img.naturalWidth * scale)); cv.height = Math.max(1, Math.round(img.naturalHeight * scale));
    const ctx = cv.getContext("2d");
    ctx.drawImage(img, 0, 0, cv.width, cv.height);
    let data;
    try { data = ctx.getImageData(0, 0, cv.width, cv.height); } catch (e) { return; }
    if (gfExtract(data.data, cv.width, cv.height)) ctx.putImageData(data, 0, 0);
    const g = measureCanvas(cv);
    if (!g) return;
    S.mem.garments = S.mem.garments || {};
    S.mem.garments[c.id] = g;
    try { localStorage.setItem("wifm-g-" + c.id, JSON.stringify(g)); } catch (e) { /* kept for this visit */ }
    render();
  };
  img.src = src;
}
// The item's own picture in lists: your cut-out from the shop photo, else the shop photo,
// else a swatch of its colour.
function photoUrlFor(c) {
  return (c && c.input && c.input.photoUrl) || (S.photos && c && S.photos[c.id]) || null;
}
function checkThumb(c) {
  const g = garmentFor(c.id);
  const url = (g && g.url) || photoUrlFor(c);
  if (url) return `<img class="thumb photo" src="${esc(url)}" alt="" loading="lazy">`;
  const it = c.result && c.result.item;
  return `<span class="thumb" style="background:${it ? it.colorHex : "var(--line)"}"></span>`;
}
function measureSaved(id, g) {
  const im = new Image();
  im.onload = () => {
    const cv = document.createElement("canvas");
    cv.width = im.naturalWidth; cv.height = im.naturalHeight;
    cv.getContext("2d").drawImage(im, 0, 0);
    const m = measureCanvas(cv);
    if (!m) return;
    S.mem.garments[id] = m;
    try { localStorage.setItem("wifm-g-" + id, JSON.stringify(m)); } catch (e) { /* kept for this visit */ }
    render();
  };
  im.src = g.url;
}

// Shop photo -> garment on the avatar, fully automatic: background, the model's skin and
// leftovers are removed by gfExtract, then the outline is measured and fitted to the body.
// There is deliberately NO manual "mark the garment" step (see garment-fit.js, rule 4).
$("#fileGarment").addEventListener("change", (e) => {
  const f = e.target.files && e.target.files[0];
  e.target.value = "";
  if (!f || S.view !== "check") return;
  const target = S.params.id, url = URL.createObjectURL(f), img = new Image();
  S.ui.garErr = null; S.ui.garBusy = true; render();
  img.onload = () => {
    URL.revokeObjectURL(url);
    const scale = Math.min(1, 800 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(img.naturalWidth * scale)); c.height = Math.max(1, Math.round(img.naturalHeight * scale));
    const ctx = c.getContext("2d");
    ctx.drawImage(img, 0, 0, c.width, c.height);
    setTimeout(() => {
      const data = ctx.getImageData(0, 0, c.width, c.height);
      const ok = gfExtract(data.data, c.width, c.height);
      if (ok) ctx.putImageData(data, 0, 0);
      else S.ui.garErr = "I couldn't separate the garment from the background, so the whole photo is used. A product photo on a plain background works best.";
      const g = measureCanvas(c);
      S.ui.garBusy = false;
      if (!g) { S.ui.garErr = "Nothing usable was found in this photo. Try another product photo."; render(); return; }
      S.mem.garments = S.mem.garments || {};
      S.mem.garments[target] = g;
      try { localStorage.setItem("wifm-g-" + target, JSON.stringify(g)); } catch (x) { /* kept for this visit only */ }
      render();
    }, 30);
  };
  img.onerror = () => { URL.revokeObjectURL(url); S.ui.garBusy = false; S.ui.garErr = "This photo couldn't be opened. Take a screenshot of the product photo and choose the screenshot instead."; render(); };
  img.src = url;
});

function afterRender(view) {
  if (view === "selfiePick") drawPickCanvas(Object.values(S.ui.sp.marks));
  if (view === "colorPick") drawPickCanvas(S.ui.cpMark ? [S.ui.cpMark] : []);
}

document.addEventListener("click", (e) => {
  const cv = e.target.closest && e.target.closest("#pickCanvas");
  if (!cv || !S.mem.pickBase) return;
  const r = cv.getBoundingClientRect();
  const x = ((e.clientX - r.left) / r.width) * cv.width, y = ((e.clientY - r.top) / r.height) * cv.height;
  const raw = sampleAt(x, y);
  if (S.view === "selfiePick") {
    const sp = S.ui.sp, k = PICK_STEPS[sp.step].k;
    sp.raw = sp.raw || {}; sp.raw[k] = raw;
    sp.picks[k] = toHex(k === "white" ? raw : balance(raw, sp.raw.white));
    sp.marks[k] = { x, y };
    if (k === "eyes") sp.choice = null;
    render();
  } else if (S.view === "colorPick") {
    S.ui.cp = toHex(raw); S.ui.cpMark = { x, y };
    render();
  }
});

function finishPicks() {
  const sp = S.ui.sp, wb = !!(sp.raw && sp.raw.white);
  const lines = [
    `Skin (cheek): ${sp.picks.skin}`,
    `Hair: ${sp.picks.hair}`,
    sp.picks.eyes ? `Eyes (iris): ${sp.picks.eyes}` : `Eyes: the user says "${sp.choice}" (not measured)`,
    wb ? "White balance: corrected using a white reference the user tapped." : "White balance: not corrected (no white reference), so indoor light may add warmth.",
  ];
  const measured = { skin: sp.picks.skin, hair: sp.picks.hair, eyes: sp.picks.eyes || null, text: lines.join("\n") };
  S.mem.selfie = null;
  go("analyzing", {}, { replace: true });
  analyseSelfie(null, measured);
}

/* ===================== Render ===================== */

function render() {
  const app = $("#app");
  const view = V[S.view] ? S.view : "home";
  app.innerHTML = V[view]();
  afterRender(view);
  const tabs = TAB_VIEWS.includes(view) && S.data.onboarded;
  app.classList.toggle("no-tabs", !tabs);
  $("#tabs").hidden = !tabs;
  if (tabs) {
    $("#tabsIn").innerHTML = [["home", "search", "Check"], ["wishlist", "heart", "Wishlist"], ["looks", "hanger", "Looks"], ["profile", "user", "Profile"]]
      .map(([v, i, l]) => `<button data-a="tab" data-v="${v}" ${v === view ? 'aria-current="page"' : ""}>${icon(i)}${l}</button>`).join("");
  }
}

function inboxRemove(id) {

function mAdvance(skip) {
  const only = S.params.only;
  const steps = only ? MEASURES.filter((s) => s.key === only) : MEASURES;
  const i = Math.min(S.ui.step || 0, steps.length - 1), st = steps[i];
  if (!skip) {
    const raw = String(S.ui.mval != null ? S.ui.mval : S.data.m[st.key] ?? "").trim().replace(",", ".");
    if (!raw) {
      if (st.req) { S.ui.mErr = `${st.title} is needed for every check.`; render(); return; }
      delete S.data.m[st.key];
    } else {
      const n = Number(raw);
      if (!isFinite(n) || n < st.min || n > st.max) { S.ui.mErr = `That looks unusual for ${st.title.toLowerCase()} — expected ${st.min}–${st.max} ${st.unit}. Check and try again.`; render(); return; }
      S.data.m[st.key] = Math.round(n * 10) / 10;
    }
    save();
  }
  S.ui.mval = null; S.ui.mErr = null;
  if (i + 1 >= steps.length) { if (only) back(); else go("selfie"); }
  else { S.ui.step = i + 1; render(); const el = $("#mInput"); if (el) el.focus(); }
}

/* ===================== Boot ===================== */

(async function boot() {
  const c = window.claude;
  const use = (n) => (c && c.use ? c.use(n).catch(() => null) : Promise.resolve(null));
  const [sample, db, user, downloads] = await Promise.all([use("sample"), use("db"), use("user"), use("downloads")]);
  S.caps.sample = sample; S.caps.db = db; S.caps.downloads = downloads;
  if (user) { try { S.caps.uid = await user.id(); } catch (e) { S.caps.uid = null; } }
  if (sample) { try { const lim = await sample.limits(); S.caps.images = lim && lim.images ? lim.images : null; } catch (e) { S.caps.images = null; } }
  await load();
  if (db && S.caps.uid) {
    try {
      db.doc("data/users/" + S.caps.uid + "/inbox").collection("items").onSnapshot((snap) => {
        S.inbox = snap.docs.filter((x) => x.exists).map((x) => Object.assign({}, x.data(), { id: x.id }));
        if (S.view === "home") render();
      }, () => {});
    } catch (e) { /* inbox unavailable */ }
    // Shop photos Claude adds to items you already checked live in their own document,
    // so they never clash with the app saving your data.
    try {
      db.doc("data/users/" + S.caps.uid + "/photos").onSnapshot((snap) => {
        S.photos = (snap && snap.exists && snap.data() && snap.data().byCheck) || {};
        if (S.view === "home" || S.view === "check" || S.view === "wishlist") render();
      }, () => {});
    } catch (e) { /* photos unavailable */ }
  }
  S.view = "boot";
  go(S.data.onboarded ? "home" : "welcome", {}, { replace: true });
})();
</script>
